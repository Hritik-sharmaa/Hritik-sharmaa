<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Fun facts: coffee, anime, sketching">
<title>Fun facts: coffee, anime, sketching</title>
<g transform="rotate(-1.2 139.0 119.0)"><rect x="15" y="15" width="262" height="222" rx="24" fill="#14121F"/><rect x="8" y="8" width="262" height="222" rx="24" fill="#fff" stroke="#14121F" stroke-width="4"/><rect x="26" y="26" width="100" height="32" rx="16" fill="#C8F03C" stroke="#14121F" stroke-width="3"/><text x="76.0" y="48" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#14121F" letter-spacing="1">COFFEE</text><text x="28" y="98" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">Coffee fuels my</text><text x="28" y="124" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">productivity — always</text><text x="28" y="150" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">hunting for the</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">perfect cup.</text><path d="M196,40 h32 l-4,34 q-1,6 -8,6 h-8 q-7,0 -8,-6z" fill="#C8F03C" stroke="#14121F" stroke-width="3" stroke-linejoin="round"/><path d="M228,48 q16,0 14,13 q-2,11 -17,10" fill="none" stroke="#14121F" stroke-width="3" stroke-linecap="round"/></g>
<g transform="rotate(0.8 425.0 119.0)"><rect x="301" y="15" width="262" height="222" rx="24" fill="#14121F"/><rect x="294" y="8" width="262" height="222" rx="24" fill="#fff" stroke="#14121F" stroke-width="4"/><rect x="312" y="26" width="89" height="32" rx="16" fill="#FFB3E6" stroke="#14121F" stroke-width="3"/><text x="356.5" y="48" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#14121F" letter-spacing="1">ANIME</text><text x="314" y="98" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">Huge anime fan:</text><text x="314" y="124" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">Naruto, One Piece,</text><text x="314" y="150" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">Tokyo Ghoul.</text><path d="M500,32.0 Q500,60 528.0,60 Q500,60 500,88.0 Q500,60 472.0,60 Q500,60 500,32.0Z" fill="#FFB3E6" stroke="#14121F" stroke-width="3" stroke-linejoin="round"/><path d="M526,28.200000000000003 Q526,38 535.8,38 Q526,38 526,47.8 Q526,38 516.2,38 Q526,38 526,28.200000000000003Z" fill="#14121F" stroke="none" stroke-width="0" stroke-linejoin="round"/></g>
<g transform="rotate(-0.8 711.0 119.0)"><rect x="587" y="15" width="262" height="222" rx="24" fill="#14121F"/><rect x="580" y="8" width="262" height="222" rx="24" fill="#fff" stroke="#14121F" stroke-width="4"/><rect x="598" y="26" width="133" height="32" rx="16" fill="#B79CFF" stroke="#14121F" stroke-width="3"/><text x="664.5" y="48" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#14121F" letter-spacing="1">SKETCHING</text><text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">Love sketching and</text><text x="600" y="124" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">drawing in my spare</text><text x="600" y="150" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14121F">time.</text><g transform="rotate(40 786 60)"><rect x="778" y="30" width="16" height="48" rx="3" fill="#C8F03C" stroke="#14121F" stroke-width="3"/><path d="M778,78 L786,92 L794,78Z" fill="#fff" stroke="#14121F" stroke-width="3" stroke-linejoin="round"/><rect x="778" y="30" width="16" height="10" rx="3" fill="#FFB3E6" stroke="#14121F" stroke-width="3"/></g></g>
